<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0055ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Logo Icon -->
  <g transform="translate(5, 5)">
    <!-- Hexagon background -->
    <rect x="0" y="0" width="40" height="40" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1" />
    <!-- Flow Lines / Play Emblem -->
    <g filter="url(#neonGlow)">
      <path d="M12 15 C 12 11, 18 10, 22 13 L 28 18 C 30 20, 30 22, 28 24 L 22 29 C 18 32, 12 31, 12 27" stroke="url(#logoGrad)" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <path d="M17 18 C 17 16, 20 15, 22 17 L 25 19 C 26 20, 26 21, 25 22 L 22 24 C 20 26, 17 25, 17 23 Z" fill="url(#logoGrad)" />
    </g>
  </g>
  
  <!-- Logo Text "StreamFlow" -->
  <text x="58" y="26" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="800" font-size="20" letter-spacing="0.5">Stream<tspan fill="url(#logoGrad)">Flow</tspan></text>
  <text x="58" y="38" fill="#9ca3af" font-family="'Inter', sans-serif" font-weight="500" font-size="9" letter-spacing="1">LIVE STREAMING SOLUTIONS</text>
</svg>
