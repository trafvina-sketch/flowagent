<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FlowAgent AI - Hệ thống Tự động hóa & Tạo Nội dung AI đỉnh cao" />
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>

    <link rel="stylesheet" href="./index.css">
</head>
<body class="bg-grid noise">
    <div id="root">
        <!-- Premium Startup Loading Screen (Prevent White Flash) -->
        <div id="startup-loader" style="
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #09090e 0%, #0d0b21 50%, #050508 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #ffffff;
            user-select: none;
        ">
            <!-- Glassmorphism Card -->
            <div style="
                padding: 3rem;
                border-radius: 28px;
                background: rgba(255, 255, 255, 0.02);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border: 1px rgba(255, 255, 255, 0.06) solid;
                box-shadow: 0 30px 70px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1.8rem;
                width: 320px;
                text-align: center;
                animation: loaderFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            ">
                <!-- Glowing Pulsing Icon Container -->
                <div style="
                    position: relative;
                    width: 80px;
                    height: 80px;
                    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
                    border-radius: 50%;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    box-shadow: 0 0 35px rgba(139, 92, 246, 0.5);
                    animation: loaderPulse 2.5s infinite ease-in-out;
                ">
                    <!-- Spinning Outer Ring -->
                    <div style="
                        position: absolute;
                        width: 96px;
                        height: 96px;
                        border-radius: 50%;
                        border: 3px solid transparent;
                        border-top-color: #06b6d4;
                        border-bottom-color: #a855f7;
                        animation: loaderSpin 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
                    "></div>
                    <!-- Icon emoji -->
                    <span style="font-size: 2.2rem; z-index: 2; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));">⚡</span>
                </div>

                <!-- Text Branding -->
                <div>
                    <h1 style="
                        margin: 0;
                        font-size: 1.8rem;
                        font-weight: 900;
                        letter-spacing: 2px;
                        background: linear-gradient(135deg, #ffffff 40%, #60a5fa 100%);
                        -webkit-background-clip: text;
                        -webkit-text-fill-color: transparent;
                        margin-bottom: 0.4rem;
                        text-shadow: 0 4px 10px rgba(0,0,0,0.3);
                    ">FLOWAGENT AI</h1>
                    <p style="
                        margin: 0;
                        font-size: 0.95rem;
                        color: #60a5fa;
                        opacity: 0.9;
                        font-weight: 600;
                        letter-spacing: 0.5px;
                        animation: loaderPulseText 1.8s infinite ease-in-out;
                    ">Hệ thống đang khởi động...</p>
                </div>
            </div>

            <!-- Styles for CSS animations -->
            <style>
                @keyframes loaderSpin {
                    0% { transform: rotate(0deg); }
                    100% { transform: rotate(360deg); }
                }
                @keyframes loaderPulse {
                    0%, 100% { transform: scale(1); box-shadow: 0 0 35px rgba(108, 92, 231, 0.5); }
                    50% { transform: scale(1.06); box-shadow: 0 0 50px rgba(255, 118, 117, 0.7); }
                }
                @keyframes loaderPulseText {
                    0%, 100% { opacity: 0.6; transform: scale(0.98); }
                    50% { opacity: 1; transform: scale(1); }
                }
                @keyframes loaderFadeIn {
                    from { opacity: 0; transform: translateY(30px); filter: blur(5px); }
                    to { opacity: 1; transform: translateY(0); filter: blur(0); }
                }
            </style>
        </div>
    </div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
